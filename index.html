<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f">
<title>FF SCAN CENTER</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2c;--panel2:#10243a;--line:#1d3852;--text:#edf6ff;--muted:#91a7bd;--blue:#37b7ff;--cyan:#68e0ff;--green:#43d6a0;--red:#ff7184;--amber:#ffc66b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#14375a 0,transparent 48%),var(--bg);color:var(--text);min-height:100vh}.topbar{min-height:68px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1b3148;background:#07111fcc;position:sticky;top:0;z-index:2;backdrop-filter:blur(14px)}.brand{display:flex;gap:10px;align-items:center;font-size:14px;letter-spacing:.06em}.brandicon{width:40px;height:40px;border:1px solid #2c9bd8;border-radius:13px;display:grid;place-items:center;color:var(--cyan);font-size:25px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em;margin-top:3px}.secure{font-size:9px;color:#a9c0d5;letter-spacing:.08em}.secure i{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:5px}.shell{max-width:980px;margin:auto;padding:28px 15px 55px;min-height:calc(100vh - 120px)}footer{text-align:center;padding:20px;color:#668098;font-size:10px;border-top:1px solid #172a3e}.hero{text-align:center;margin:18px auto 28px;max-width:650px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--cyan);font-weight:700}.hero h1{font-size:clamp(28px,7vw,46px);margin:12px 0 8px}.hero p,.muted{color:var(--muted);line-height:1.75;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#10243aee,#0a1726f2);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 18px 45px #0003}.access{min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.iconbox{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#143756;color:var(--cyan);font-size:23px}.card h2{font-size:18px;margin:14px 0 5px}.btn{border:0;border-radius:12px;padding:13px 16px;background:linear-gradient(110deg,#168bd0,#35c1ed);color:#041321;font-weight:800;font-size:12px;cursor:pointer;min-height:46px}.btn.secondary{background:#142a40;color:#d8ebfa;border:1px solid #294760}.btn.danger{background:#542332;color:#ffdce2;border:1px solid #814050}.btn.full{width:100%}.btn.small{min-height:35px;padding:7px 10px;font-size:10px}.field{display:block;margin:16px 0}.field span{display:block;font-size:11px;color:#b5c9da;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #29445d;background:#071625;color:var(--text);padding:13px;border-radius:11px;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:var(--blue)}.formcard{max-width:480px;margin:24px auto}.notice{padding:12px 14px;border:1px solid #29445d;border-radius:12px;color:#adc5d9;background:#0a1a2b;font-size:12px;line-height:1.7;margin:13px 0;overflow-wrap:anywhere}.error{color:#ff9aa8;border-color:#733747;background:#291722}.success{color:#82e8bf;border-color:#28684f;background:#102a25}.back{color:var(--cyan);background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{font-size:24px;margin:4px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{padding:14px;border-radius:14px;background:#0d1d2e;border:1px solid var(--line)}.stat strong{font-size:22px;display:block}.stat span{color:var(--muted);font-size:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:600px;font-size:11px}th,td{text-align:left;padding:11px;border-bottom:1px solid #1a3045}th{color:#92adc5;font-size:10px;background:#0a1827}td{color:#d8e7f4}.pill{font-size:9px;border-radius:99px;padding:5px 8px;background:#163b32;color:#79e4b7}.pill.off{background:#41232d;color:#ff9aa8}.scannerhero{background:linear-gradient(120deg,#102d49,#0c1b2c);border:1px solid #245071;border-radius:20px;padding:22px;text-align:center;margin-bottom:17px}.scanbtn{width:min(220px,75vw);height:58px;margin:12px auto}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.check{background:#0d1b2b;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;color:var(--text);min-height:84px}.check strong{display:block;font-size:12px;margin-bottom:7px}.check span{font-size:10px;color:var(--amber)}.filebox{border:1px dashed #35607e;background:#0c1d2e;border-radius:16px;padding:18px;margin:16px 0}.filemeta{font-size:11px;color:#b0c5d7;line-height:1.8;overflow-wrap:anywhere}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#020812d9;display:grid;place-items:center;padding:18px;z-index:5}.modal .card{max-width:500px;width:100%;max-height:85vh;overflow:auto}code{overflow-wrap:anywhere;color:#8de5ff}@media(max-width:600px){.grid,.checks{grid-template-columns:1fr}.shell{padding-top:22px}.card{padding:17px}.access{min-height:170px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:18px}.head{align-items:flex-start}.secure{font-size:8px}}
</style></head>
<body><header class="topbar"><div class="brand"><div class="brandicon">⬡</div><div>FF <b>SCAN CENTER</b><small>ระบบตรวจสอบความปลอดภัย Android</small></div></div><span class="secure"><i></i> ระบบตรวจสอบเบื้องต้น</span></header><main id="app" class="shell"></main><footer>FF SCAN CENTER • เป็นการตรวจสอบเบื้องต้น ไม่ได้รับรองความปลอดภัย 100%</footer>
<script>
const app=document.getElementById('app'),DURS={'3 ชั่วโมง':10800000,'6 ชั่วโมง':21600000,'1 วัน':86400000,'7 วัน':604800000,'30 วัน':2592000000,'90 วัน':7776000000,'180 วัน':15552000000,'ตลอดชีพ':0}; let countdownTimer=null;
const checks=[['สถานะ Root','ต้องรับผลตรวจจากแอป Android ตัวช่วย','รอแอป Android'],['สถานะ VPN','ต้องรับผลตรวจจากแอป Android ตัวช่วย','รอแอป Android'],['สถานะ Shizuku','ต้องรับผลตรวจจากแอป Android ตัวช่วย','รอแอป Android'],['แอปที่ติดตั้ง','ต้องได้รับสิทธิ์ Android ที่เหมาะสมก่อนตรวจ','รอแอป Android'],['สิทธิ์แอป','ต้องรับข้อมูลจาก Android API','รอแอป Android'],['ไฟล์ที่ดาวน์โหลด','เลือกไฟล์ที่ต้องการให้เว็บอ่านได้','พร้อมเลือกไฟล์'],['ตรวจสอบไฟล์ APK','คำนวณ SHA-256 ได้ แต่ยังต้องเชื่อมฐานข้อมูลวิเคราะห์','พร้อมเลือกไฟล์'],['ตรวจสอบไฟล์ ZIP','คำนวณ SHA-256 ของไฟล์ที่เลือกได้','พร้อมเลือกไฟล์'],['ไฟล์ที่เกี่ยวข้องกับเกม','ต้องใช้สิทธิ์ Android และไม่เข้าถึงข้อมูลส่วนตัวที่ระบบป้องกัน','รอแอป Android'],['ความปลอดภัยอุปกรณ์','รวมผลจากแอป Android และข้อมูลที่ตรวจได้','รอแอป Android']];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let pickedFile=null;
function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">ตรวจสอบความปลอดภัย • ตรวจสอบไฟล์</div><h1>FF SCAN CENTER</h1><p>ระบบตรวจสอบความปลอดภัย Android<br>ระบบตรวจสอบไฟล์และข้อมูลความปลอดภัยเบื้องต้นของ Android</p></section><div class="grid"><section class="card access"><div><div class="iconbox">⌁</div><h2>สำหรับลูกค้า</h2><p class="muted">กรอกรหัสคีย์เพื่อเริ่มใช้งาน</p></div><button class="btn full" onclick="customerLogin()">เปิดใช้งานรหัสคีย์</button></section><section class="card access"><div><div class="iconbox">⬡</div><h2>ดูแลระบบ</h2><p class="muted">เข้าสู่ระบบผู้ดูแล</p></div><button class="btn secondary full" onclick="adminLogin()">เข้าสู่หน้าผู้ดูแล</button></section></div><div class="notice">ระบบหน้าเว็บภาษาไทยพร้อมสำหรับเชื่อมต่อแอป Android ในขั้นตอนถัดไป ขณะนี้การสร้างคีย์และข้อมูลยังเป็นโหมดทดลองในเบราว์เซอร์เครื่องนี้</div>`}
function adminLogin(){app.innerHTML=`<section class="card formcard"><button class="back" onclick="home()">← กลับหน้าหลัก</button><h2 style="margin-top:20px">เข้าสู่ระบบผู้ดูแล</h2><p class="muted">กรอกรหัสผ่านเพื่อจัดการคีย์ลูกค้า</p><form id="login"><label class="field"><span>รหัสผ่านผู้ดูแล</span><input id="pass" type="password" placeholder="กรอกรหัสผ่าน" required></label><button class="btn full">เข้าสู่ระบบ</button></form><div id="msg"></div></section>`;document.getElementById('login').onsubmit=e=>{e.preventDefault();let p=document.getElementById('pass').value,stored=localStorage.getItem('ffsc_admin_pass')||'1199xx';if(p!==stored){document.getElementById('msg').innerHTML='<div class="notice error">รหัสผ่านไม่ถูกต้อง</div>';return}adminDashboard()}}
function adminDashboard(){let ls=read('ffsc_licenses',[]);app.innerHTML=`<div class="head"><div><div class="eyebrow">หน้าจัดการผู้ดูแล</div><h1>แผงควบคุมผู้ดูแล</h1><div class="muted">จัดการรหัสคีย์และเวลาการใช้งาน</div></div><button class="btn secondary small" onclick="home()">ออกจากระบบ</button></div><div class="stats"><div class="stat"><strong>${ls.length}</strong><span>รหัสคีย์ทั้งหมด</span></div><div class="stat"><strong>${ls.filter(x=>x.status==='ACTIVE'&&(!x.exp||x.exp>Date.now())).length}</strong><span>ใช้งานอยู่</span></div><div class="stat"><strong>${ls.filter(x=>x.status==='SUSPENDED').length}</strong><span>ระงับการใช้งาน</span></div></div><section class="card"><h2>สร้างรหัสคีย์ให้ลูกค้า</h2><div class="row"><label class="field" style="flex:1;margin:0"><span>กำหนดเวลาใช้งาน (เริ่มนับเมื่อลูกค้าใส่คีย์)</span><select id="duration">${Object.keys(DURS).map(x=>`<option>${x}</option>`).join('')}</select></label><button class="btn" onclick="createLicense()">สร้างรหัสคีย์</button></div><div id="createdKey"></div></section><section class="card" style="margin-top:14px"><div class="row between"><h2>จัดการรหัสคีย์</h2><button class="btn secondary small" onclick="changePass()">เปลี่ยนรหัสผ่าน</button></div><label class="field"><span>ค้นหารหัสคีย์</span><input id="search" placeholder="พิมพ์รหัสคีย์เพื่อค้นหา" oninput="filterRows()"></label><div class="tablewrap"><table><thead><tr><th>รหัสคีย์</th><th>ระยะเวลา</th><th>เริ่มนับ / หมดอายุ</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="rows">${rows(ls)}</tbody></table></div></section>`}
function rows(ls){return ls.map((x,i)=>{let expired=!!(x.exp&&x.exp<Date.now()),period=x.activatedAt?(x.exp?new Date(x.exp).toLocaleString('th-TH'):'เริ่มแล้ว • ตลอดชีพ'):'ยังไม่เริ่มนับ';return `<tr><td>#${i+1}<br><small>••••${esc(x.key.slice(-5))}</small></td><td>${esc(x.duration)}</td><td>${period}</td><td><span class="pill ${x.status==='ACTIVE'&&!expired?'':'off'}">${expired?'หมดอายุ':x.status==='ACTIVE'?'พร้อมใช้งาน':'ระงับ'}</span></td><td><button class="btn secondary small" onclick="toggle(${i})">${x.status==='ACTIVE'?'ระงับ':'เปิดใช้'}</button> <button class="btn danger small" onclick="removeKey(${i})">ลบ</button></td></tr>`}).join('')||'<tr><td colspan="5">ยังไม่มีรหัสคีย์</td></tr>'}
function createLicense(){let duration=document.getElementById('duration').value,key='FFSC-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('').toUpperCase().match(/.{1,8}/g).join('-'),ls=read('ffsc_licenses',[]);ls.push({key,duration,ms:DURS[duration],activatedAt:0,exp:0,status:'ACTIVE',device:''});write('ffsc_licenses',ls);adminDashboard();document.getElementById('createdKey').innerHTML=`<div class="notice success">สร้างรหัสคีย์เรียบร้อยแล้ว คัดลอกส่งให้ลูกค้าได้เลย<br><b>${key}</b><br><small>เวลาจะเริ่มนับเมื่อลูกค้านำคีย์ไปเปิดใช้งานครั้งแรก</small><br><button class="btn secondary small" onclick="copyKey('${key}')">คัดลอกรหัสคีย์</button></div>`}
function copyKey(k){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(k).then(()=>alert('คัดลอกแล้ว')).catch(()=>prompt('คัดลอกคีย์นี้',k));else prompt('คัดลอกคีย์นี้',k)}function filterRows(){let q=document.getElementById('search').value.toLowerCase(),ls=read('ffsc_licenses',[]).filter(x=>x.key.toLowerCase().includes(q));document.getElementById('rows').innerHTML=rows(ls)}function toggle(i){let ls=read('ffsc_licenses',[]);ls[i].status=ls[i].status==='ACTIVE'?'SUSPENDED':'ACTIVE';write('ffsc_licenses',ls);adminDashboard()}function removeKey(i){if(!confirm('ยืนยันลบ License นี้?'))return;let ls=read('ffsc_licenses',[]);ls.splice(i,1);write('ffsc_licenses',ls);adminDashboard()}
function changePass(){app.innerHTML=`<section class="card formcard"><button class="back" onclick="adminDashboard()">← กลับ</button><h2 style="margin-top:20px">เปลี่ยนรหัสผ่านผู้ดูแล</h2><form id="cp"><label class="field"><span>รหัสผ่านปัจจุบัน</span><input id="old" type="password" required></label><label class="field"><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</span><input id="newp" type="password" minlength="8" required></label><button class="btn full">บันทึกรหัสผ่าน</button></form><div id="msg"></div></section>`;document.getElementById('cp').onsubmit=e=>{e.preventDefault();if(document.getElementById('old').value!==(localStorage.getItem('ffsc_admin_pass')||'1199xx')){document.getElementById('msg').innerHTML='<div class="notice error">รหัสผ่านเดิมไม่ถูกต้อง</div>';return}localStorage.setItem('ffsc_admin_pass',document.getElementById('newp').value);adminDashboard()}}
function deviceId(){let id=localStorage.getItem('ffsc_device');if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem('ffsc_device',id)}return id}
function customerLogin(){app.innerHTML=`<section class="card formcard"><button class="back" onclick="home()">← กลับหน้าหลัก</button><h2 style="margin-top:20px">สำหรับลูกค้า</h2><p class="muted">วางรหัสคีย์ที่ได้รับเพื่อเปิดใช้งานบนเบราว์เซอร์นี้</p><form id="activate"><label class="field"><span>รหัสคีย์ของคุณ</span><input id="license" placeholder="วางรหัสคีย์ที่นี่" required autocapitalize="characters"></label><button class="btn full">ยืนยันและเริ่มใช้งาน</button></form><div id="msg"></div><div class="notice">เวลาจะเริ่มนับทันทีที่กดยืนยันครั้งแรก และคีย์จะผูกกับเบราว์เซอร์นี้ หากล้างข้อมูลเว็บไซต์อาจต้องเปิดใช้งานใหม่</div></section>`;document.getElementById('activate').onsubmit=e=>{e.preventDefault();let key=document.getElementById('license').value.trim().toUpperCase(),ls=read('ffsc_licenses',[]),x=ls.find(x=>x.key===key);if(!x||x.status!=='ACTIVE'||(x.activatedAt&&x.exp&&x.exp<Date.now())){document.getElementById('msg').innerHTML='<div class="notice error">รหัสคีย์ไม่ถูกต้อง ถูกระงับ หรือหมดอายุ</div>';return}if(x.device&&x.device!==deviceId()){document.getElementById('msg').innerHTML='<div class="notice error">รหัสคีย์นี้ถูกผูกกับเบราว์เซอร์อื่นแล้ว</div>';return}x.device=deviceId();if(!x.activatedAt){x.activatedAt=Date.now();x.exp=x.ms?x.activatedAt+x.ms:0}write('ffsc_licenses',ls);localStorage.setItem('ffsc_active_key',key);scanner()}}
function scanner(){if(countdownTimer)clearInterval(countdownTimer);let key=localStorage.getItem('ffsc_active_key'),x=read('ffsc_licenses',[]).find(x=>x.key===key);if(!x||x.status!=='ACTIVE'||(x.activatedAt&&x.exp&&x.exp<Date.now())){localStorage.removeItem('ffsc_active_key');return customerLogin()}let expiry=x.exp?new Date(x.exp).toLocaleString('th-TH'):'ตลอดชีพ';app.innerHTML=`<div class="head"><div><div class="eyebrow">พื้นที่ใช้งานสำหรับลูกค้า</div><h1>ศูนย์ตรวจสอบความปลอดภัย</h1><div class="muted">แพ็กเกจ: ${esc(x.duration)} • หมดอายุ: ${expiry}</div></div><button class="btn secondary small" onclick="localStorage.removeItem('ffsc_active_key');home()">ออกจากระบบ</button></div><div class="scannerhero"><div class="iconbox" style="margin:auto">⬡</div><h2>ระบบตรวจสอบ Android</h2><p class="muted">ตรวจสอบเบื้องต้นตามสิทธิ์ที่เบราว์เซอร์อนุญาต</p><div id="countdown" style="font-size:22px;font-weight:800;color:var(--cyan);margin:12px 0">กำลังคำนวณเวลา...</div><button class="btn scanbtn" onclick="startScan()">เริ่มตรวจสอบ</button><div id="scanStatus" class="muted">ยังไม่ได้เริ่มการตรวจสอบ</div></div><div class="row between"><h2>รายการตรวจสอบ</h2><span class="muted">10 รายการ</span></div><div class="checks">${checks.map((c,i)=>`<button class="check" onclick="showCheck(${i})"><strong>${c[0]}</strong><span>${esc(c[2])}</span></button>`).join('')}</div><section class="filebox"><h3>เลือกไฟล์เพื่อตรวจสอบ</h3><p class="muted">เลือกไฟล์เพื่ออ่านข้อมูลและคำนวณ SHA-256 ในเบราว์เซอร์ ไฟล์จะไม่ถูกอัปโหลด</p><input id="file" type="file" class="hidden"><button class="btn secondary" onclick="document.getElementById('file').click()">เลือกไฟล์</button><div id="fileInfo" class="filemeta" style="margin-top:12px">ยังไม่ได้เลือกไฟล์</div></section><div class="notice">การตรวจ Root, VPN, Shizuku และรายการแอปจะทำงานเมื่อเชื่อมต่อแอป Android ตัวช่วยแล้วเท่านั้น ขณะนี้ยังไม่พบตัวช่วย จึงยังไม่แสดงผลผ่านการคาดเดา</div><div class="notice" id="bridgeStatus">สถานะตัวช่วย Android: ยังไม่ได้เชื่อมต่อ</div><div class="row"><button class="btn secondary" onclick="connectAndroidHelper()">เชื่อมต่อแอป Android</button><button class="btn secondary" onclick="showInstallInfo()">วิธีติดตั้ง APK</button></div><div id="modalRoot"></div>`;document.getElementById('file').addEventListener('change',handleFile);updateCountdown();countdownTimer=setInterval(updateCountdown,1000)}
function updateCountdown(){let key=localStorage.getItem('ffsc_active_key'),x=read('ffsc_licenses',[]).find(x=>x.key===key),el=document.getElementById('countdown');if(!el||!x)return;if(!x.exp){el.textContent='ใช้งานได้ตลอดชีพ';return}let left=x.exp-Date.now();if(left<=0){clearInterval(countdownTimer);el.textContent='หมดเวลาการใช้งาน';localStorage.removeItem('ffsc_active_key');setTimeout(customerLogin,700);return}let h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),sec=Math.floor(left%60000/1000);el.textContent=`เวลาคงเหลือ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function startScan(){const status=document.getElementById('scanStatus');if(window.FFScanAndroid&&typeof window.FFScanAndroid.scan==='function'){status.textContent='กำลังส่งคำขอตรวจสอบไปยังแอป Android...';try{window.FFScanAndroid.scan()}catch(e){status.textContent='เชื่อมต่อแอป Android ไม่สำเร็จ: '+e.message}return}status.textContent='ยังไม่พบแอป Android ตัวช่วย กรุณาติดตั้ง APK และเปิดการเชื่อมต่อก่อน จึงจะตรวจ Root, VPN, Shizuku และแอปที่ติดตั้งได้';document.getElementById('bridgeStatus').textContent='สถานะตัวช่วย Android: ยังไม่ได้เชื่อมต่อ'}
function connectAndroidHelper(){if(window.FFScanAndroid){document.getElementById('bridgeStatus').textContent='สถานะตัวช่วย Android: พบการเชื่อมต่อแล้ว';document.getElementById('scanStatus').textContent='พร้อมส่งคำขอตรวจสอบ'}else{document.getElementById('bridgeStatus').textContent='สถานะตัวช่วย Android: ยังไม่พบ APK ที่เชื่อมต่อกับหน้านี้';alert('ยังไม่มี APK ตัวช่วยที่เชื่อมต่อกับเว็บไซต์ ขั้นตอนนี้จะเปิดใช้งานหลังสร้าง APK เสร็จ')} }
function showInstallInfo(){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)this.innerHTML=''"><section class="card"><div class="row between"><h2>ติดตั้งแอป Android ตัวช่วย</h2><button class="back" onclick="document.getElementById('modalRoot').innerHTML=''">ปิด ✕</button></div><p class="muted">ไฟล์ APK ยังอยู่ระหว่างจัดทำ จึงยังไม่มีลิงก์ดาวน์โหลดในตอนนี้ เมื่อสร้าง APK และเชื่อมต่อกับเว็บไซต์แล้ว ปุ่มเริ่มสแกนจะส่งคำขอไปตรวจสอบข้อมูลที่ Android อนุญาต</p><div class="notice">จะไม่มีการแสดงผล Root, VPN, Shizuku หรือรายชื่อแอปแบบสุ่มหรือแต่งขึ้น หากยังไม่ได้รับข้อมูลจริงจาก Android</div></section></div>`}function showCheck(i){let c=checks[i];document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)this.innerHTML='' "><section class="card"><div class="row between"><h2>${c[0]}</h2><button class="back" onclick="document.getElementById('modalRoot').innerHTML=''">ปิด ✕</button></div><span class="pill">${c[2]}</span><p class="muted" style="margin-top:18px">${c[1]}</p><div class="notice">Browser ไม่มีสิทธิ์/API ที่จำเป็นสำหรับการตรวจรายการนี้ จึงไม่สามารถสรุปผลความปลอดภัยได้</div></section></div>`}
async function handleFile(e){let f=e.target.files[0];if(!f)return;let out=document.getElementById('fileInfo');out.textContent='กำลังอ่านไฟล์และคำนวณ SHA-256...';try{if(!crypto.subtle)throw Error('เบราว์เซอร์ไม่รองรับ Web Crypto API ในบริบทนี้');let hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');out.innerHTML=`<div class="notice success"><b>อ่านไฟล์สำเร็จ</b><br>ชื่อไฟล์: ${esc(f.name)}<br>ขนาด: ${f.size.toLocaleString()} ไบต์<br>ประเภท: ${esc(f.type||'ไม่ระบุ')}<br>SHA-256:<br><code>${hash}</code><br><small>ประมวลผลในเครื่อง ไม่ได้อัปโหลดไฟล์</small></div>`}catch(err){out.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}
home();
</script></body></html>
