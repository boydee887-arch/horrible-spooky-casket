<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1f7">
<title>FF SCAN CENTER — Professional License Management</title>
<style>
:root {
  color-scheme: light;
  --bg: #fff8fb;
  --panel: #ffffff;
  --line: #f5d0e2;
  --text: #4a283b;
  --muted: #9e768b;
  --pink: #ec4899;
  --pink-dark: #be185d;
  --pink-light: #fdf2f8;
  --pink-soft: #fce7f3;
  --green: #059669;
  --red: #e11d48;
  --amber: #d97706;
  
  /* Admin Neutral Palette */
  --admin-bg: #f8fafc;
  --admin-panel: #ffffff;
  --admin-line: #e2e8f0;
  --admin-text: #334155;
  --admin-muted: #64748b;
  
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  text-size-adjust: 100%;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% -15%, #ffe4f1 0, transparent 55%), var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Topbar */
.topbar {
  min-height: 72px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.85);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--pink-dark);
}

.brandicon {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: var(--pink-dark);
  font-size: 22px;
  background: var(--pink-light);
  box-shadow: 0 4px 12px rgba(236, 72, 153, 0.08);
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.14em;
  font-weight: 500;
  margin-top: 2px;
}

.secure {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.06em;
  background: var(--pink-light);
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
}

.secure i {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  margin-right: 6px;
  box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
}

/* Shell Layout */
.shell {
  max-width: 960px;
  margin: auto;
  padding: 32px 16px 64px;
  min-height: calc(100vh - 130px);
}

footer {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 11px;
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.4);
}

/* Typography & Hero */
.hero {
  text-align: center;
  margin: 20px auto 32px;
  max-width: 680px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--pink-dark);
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 6px;
  display: inline-block;
}

.hero h1 {
  font-size: clamp(28px, 6vw, 42px);
  margin: 8px 0 12px;
  color: var(--pink-dark);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.hero p, .muted {
  color: var(--muted);
  line-height: 1.7;
  font-size: 13px;
}

/* Cards & Grid System */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.card {
  background: linear-gradient(145deg, #ffffff, #fffbfe);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 10px 35px -10px rgba(236, 72, 153, 0.1);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.access-card {
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.iconbox {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--pink-soft);
  color: var(--pink-dark);
  font-size: 22px;
}

.card h2 {
  font-size: 18px;
  margin: 14px 0 6px;
  color: var(--text);
  font-weight: 700;
}

/* Buttons */
.btn {
  border: 0;
  border-radius: 14px;
  padding: 14px 20px;
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  color: white;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(236, 72, 153, 0.25);
  transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  width: 100%;
}

.btn:hover {
  opacity: 0.95;
  transform: translateY(-1px);
  box-shadow: 0 8px 25px rgba(236, 72, 153, 0.35);
}

.btn:active {
  transform: translateY(0);
}

.btn.secondary {
  background: var(--pink-light);
  color: var(--pink-dark);
  border: 1px solid var(--line);
  box-shadow: none;
}

.btn.secondary:hover {
  background: var(--pink-soft);
  box-shadow: none;
}

.btn.danger {
  background: #fff1f2;
  color: var(--red);
  border: 1px solid #fecdd3;
  box-shadow: none;
}

.btn.danger:hover {
  background: #ffe4e6;
  box-shadow: none;
}

.btn.full {
  width: 100%;
}

.btn.small {
  min-height: 38px;
  padding: 8px 14px;
  font-size: 11px;
  width: auto;
  box-shadow: none;
}

/* Form Fields */
.field {
  display: block;
  margin: 18px 0;
}

.field span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.field input, .field select {
  width: 100%;
  border: 1px solid var(--line);
  background: #ffffff;
  color: var(--text);
  padding: 14px 16px;
  border-radius: 12px;
  font: inherit;
  outline: none;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus, .field select:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.12);
}

.formcard {
  max-width: 480px;
  margin: 28px auto;
}

/* Notices & Alerts */
.notice {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--text);
  background: var(--pink-light);
  font-size: 12px;
  line-height: 1.7;
  margin: 16px 0;
  overflow-wrap: anywhere;
  box-shadow: 0 4px 15px rgba(236, 72, 153, 0.05);
}

.notice.error {
  color: #9f1239;
  border-color: #fecdd3;
  background: #fff1f2;
}

.notice.success {
  color: #065f46;
  border-color: #a7f3d0;
  background: #ecfdf5;
}

.back {
  color: var(--pink-dark);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.back:hover {
  text-decoration: underline;
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.between {
  justify-content: space-between;
}

/* Dashboard & Stats */
.dashboard-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.dashboard-head h1 {
  font-size: 26px;
  margin: 4px 0;
  color: var(--pink-dark);
  font-weight: 800;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 18px 0;
}

.stat {
  padding: 16px;
  border-radius: 16px;
  background: #ffffff;
  border: 1px solid var(--line);
  box-shadow: 0 4px 15px rgba(236, 72, 153, 0.04);
}

.stat strong {
  font-size: 24px;
  display: block;
  color: var(--pink-dark);
  font-weight: 800;
}

.stat span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
}

/* Tables & Wrappers */
.tablewrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 16px;
  margin-top: 16px;
  background: #ffffff;
  box-shadow: 0 4px 20px rgba(236, 72, 153, 0.04);
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 600px;
  font-size: 12px;
}

th, td {
  text-align: left;
  padding: 14px 16px;
  border-bottom: 1px solid #fbe8f1;
}

th {
  color: var(--pink-dark);
  font-size: 10px;
  background: var(--pink-light);
  letter-spacing: 0.08em;
  font-weight: 700;
  text-transform: uppercase;
}

td {
  color: var(--text);
}

.pill {
  font-size: 10px;
  border-radius: 99px;
  padding: 5px 10px;
  background: #ecfdf5;
  color: var(--green);
  font-weight: 700;
  display: inline-block;
}

.pill.off {
  background: #fff1f2;
  color: var(--red);
}

.pill.warn {
  background: #fffbeb;
  color: var(--amber);
}

/* Scanner */
.scanner-hero {
  background: linear-gradient(135deg, var(--pink-light), #ffffff);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 28px;
  text-align: center;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(236, 72, 153, 0.06);
}

.scan-button {
  width: min(240px, 80vw);
  height: 60px;
  margin: 16px auto;
  font-size: 15px;
  border-radius: 16px;
}

.checks {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.check {
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  text-align: left;
  color: var(--text);
  min-height: 90px;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.check:hover {
  border-color: var(--pink);
  box-shadow: 0 4px 15px rgba(236, 72, 153, 0.08);
}

.check strong {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
  font-weight: 700;
}

.check span {
  font-size: 11px;
  color: var(--amber);
  font-weight: 600;
}

.filebox {
  border: 2px dashed #f4b6d4;
  background: var(--pink-light);
  border-radius: 18px;
  padding: 24px;
  margin: 18px 0;
  text-align: center;
}

.filemeta {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.hidden { display: none !important; }
.detail { margin-top: 14px; }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(74, 40, 59, 0.5);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 100;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.modal .card {
  max-width: 520px;
  width: 100%;
  max-height: 88vh;
  overflow: auto;
}

code {
  overflow-wrap: anywhere;
  color: var(--pink-dark);
  background: var(--pink-light);
  padding: 2px 6px;
  border-radius: 6px;
  font-family: monospace;
}

/* ==========================================================
   ADMIN SECTION STYLING (วางล่างสุด โทนสีเทา เรียบง่าย ไม่เด่นกว่าลูกค้า)
   ========================================================== */
.admin-section {
  margin-top: 56px;
  padding-top: 32px;
  border-top: 2px dashed var(--admin-line);
}

.admin-container {
  background: var(--admin-bg);
  border: 1px solid var(--admin-line);
  border-radius: 20px;
  padding: 24px;
  color: var(--admin-text);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
}

.admin-container .card {
  background: var(--admin-panel) !important;
  border-color: var(--admin-line) !important;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03) !important;
  border-radius: 16px;
}

.admin-container th {
  background: #f1f5f9 !important;
  color: var(--admin-muted) !important;
  border-bottom-color: var(--admin-line) !important;
}

.admin-container td {
  color: var(--admin-text) !important;
  border-bottom-color: var(--admin-line) !important;
}

.admin-container .btn:not(.secondary):not(.danger) {
  background: var(--admin-muted) !important;
  color: #ffffff !important;
  box-shadow: none !important;
}

.admin-container .btn:not(.secondary):not(.danger):hover {
  background: #475569 !important;
}

.admin-container .btn.secondary {
  background: #ffffff !important;
  color: var(--admin-text) !important;
  border: 1px solid var(--admin-line) !important;
}

.admin-container .btn.secondary:hover {
  background: #f1f5f9 !important;
}

/* Responsive Breakpoints */
@media(max-width: 600px) {
  .grid, .checks { grid-template-columns: 1fr; }
  .shell { padding: 20px 12px 48px; }
  .card { padding: 18px; }
  .stats { gap: 8px; }
  .stat { padding: 12px; }
  .stat strong { font-size: 20px; }
  .dashboard-head { align-items: flex-start; }
  .secure { font-size: 9px; padding: 5px 10px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brandicon">⬡</div>
    <div>
      FF <b>SCAN CENTER</b>
      <small>ระบบตรวจสอบความปลอดภัย Android</small>
    </div>
  </div>
  <span class="secure"><i></i> ระบบเชื่อมต่อปลอดภัย</span>
</header>

<main id="app" class="shell">
  <div class="notice">กำลังโหลดระบบ FF SCAN CENTER...</div>
</main>

<footer>
  FF SCAN CENTER • ระบบจัดการ License ความปลอดภัยเบื้องต้น ไม่ได้รับรองความปลอดภัย 100%
</footer>

<script src="/app.js"></script>
</body>
</html>
