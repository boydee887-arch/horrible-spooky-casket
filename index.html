<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1f7">
<title>FF SCAN CENTER</title>
<style>
:root {
  color-scheme: light;
  --bg:#fff7fa;
  --panel:#ffffff;
  --line:#f3c9dc;
  --text:#452538;
  --muted:#987487;
  --pink:#ed5b9b;
  --pink-dark:#d83e83;
  --pink-soft:#ffe3ef;
  --green:#16865e;
  --red:#c43d59;
  --amber:#a66a12;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#ffd7e8 0,transparent 52%),var(--bg);color:var(--text)}
.topbar{min-height:68px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffafcff;position:sticky;top:0;z-index:2;backdrop-filter:blur(14px)}
.brand{display:flex;gap:10px;align-items:center;font-size:14px;letter-spacing:.06em}
.brandicon{width:40px;height:40px;border:1px solid var(--pink);border-radius:13px;display:grid;place-items:center;color:var(--pink-dark);font-size:25px;background:#fff0f6}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em;margin-top:3px}
.secure{font-size:9px;color:#8d7180;letter-spacing:.08em}
.secure i{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:5px}
.shell{max-width:980px;margin:auto;padding:28px 15px 55px;min-height:calc(100vh - 120px)}
footer{text-align:center;padding:20px;color:#a48796;font-size:10px;border-top:1px solid var(--line)}
.hero{text-align:center;margin:18px auto 28px;max-width:650px}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--pink-dark);font-weight:800}
.hero h1{font-size:clamp(28px,7vw,46px);margin:12px 0 8px;color:#b82f70}
.hero p,.muted{color:var(--muted);line-height:1.75;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:linear-gradient(145deg,#fff,#fff8fb);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 18px 45px #8b315018}
.access-card{min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.iconbox{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink-dark);font-size:23px}
.card h2{font-size:18px;margin:14px 0 5px}
.btn{border:0;border-radius:12px;padding:13px 16px;background:linear-gradient(110deg,var(--pink-dark),#f58ab8);color:white;font-weight:800;font-size:12px;cursor:pointer;min-height:46px}
.btn.secondary{background:#fff0f6;color:#a83b70;border:1px solid #efbdd3}
.btn.danger{background:#fff0f2;color:#a92e4a;border:1px solid #edb9c5}
.btn.full{width:100%}
.btn.small{min-height:35px;padding:7px 10px;font-size:10px}
.field{display:block;margin:16px 0}
.field span{display:block;font-size:11px;color:#896579;margin-bottom:7px}
.field input,.field select{width:100%;border:1px solid #e8bfd1;background:#fff;color:var(--text);padding:13px;border-radius:11px;font:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--pink);box-shadow:0 0 0 3px #ed5b9b20}
.formcard{max-width:480px;margin:24px auto}
.notice{padding:12px 14px;border:1px solid #efc7d9;border-radius:12px;color:#896579;background:#fff5f9;font-size:12px;line-height:1.7;margin:13px 0;overflow-wrap:anywhere}
.notice.error{color:#a92e4a;border-color:#edb9c5;background:#fff0f2}
.notice.success{color:#176b4d;border-color:#b7e2d0;background:#effbf5}
.back{color:var(--pink-dark);background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.dashboard-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.dashboard-head h1{font-size:24px;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}
.stat{padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.stat strong{font-size:22px;display:block;color:#b82f70}
.stat span{color:var(--muted);font-size:10px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:11px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #f3dce6}
th{color:#916d80;font-size:10px;background:#fff2f7}
td{color:#68475a}
.pill{font-size:9px;border-radius:99px;padding:5px 8px;background:#e5f7ee;color:#16865e}
.pill.off{background:#fff0f2;color:#c43d59}
.pill.warn{background:#fff5df;color:#a66a12}
.scanner-hero{background:linear-gradient(120deg,#fff0f6,#fff);border:1px solid #efbfd4;border-radius:20px;padding:22px;text-align:center;margin-bottom:17px}
.scan-button{width:min(220px,75vw);height:58px;margin:12px auto}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;color:var(--text);min-height:84px;cursor:pointer}
.check strong{display:block;font-size:12px;margin-bottom:7px}
.check span{font-size:10px;color:var(--amber)}
.filebox{border:1px dashed #e5a8c4;background:#fff8fb;border-radius:16px;padding:18px;margin:16px 0}
.filemeta{font-size:11px;color:#896579;line-height:1.8;overflow-wrap:anywhere}
.hidden{display:none!important}
.detail{margin-top:12px}
.modal{position:fixed;inset:0;background:#48233880;display:grid;place-items:center;padding:18px;z-index:5}
.modal .card{max-width:500px;width:100%;max-height:85vh;overflow:auto}
code{overflow-wrap:anywhere;color:#b82f70}
@media(max-width:600px){.grid,.checks{grid-template-columns:1fr}.shell{padding-top:22px}.card{padding:17px}.access-card{min-height:170px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:18px}.dashboard-head{align-items:flex-start}.secure{font-size:8px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brandicon">⬡</div>
    <div>
      FF <b>SCAN CENTER</b>
      <small>ระบบตรวจสอบความปลอดภัย Android</small>
    </div>
  </div>
  <span class="secure"><i></i> ระบบตรวจสอบเบื้องต้น</span>
</header>
<main id="app" class="shell">
  <div class="notice">กำลังโหลด FF SCAN CENTER...</div>
</main>
<footer>
  FF SCAN CENTER • เป็นการตรวจสอบเบื้องต้น ไม่ได้รับรองความปลอดภัย 100%
</footer>
<script src="/app.js"></script>
</body>
</html>
