
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>FF SCAN CENTER</title>

<style>
:root {
  color-scheme: dark;
  --bg:#07111f;
  --panel:#0d1b2c;
  --line:#1d3852;
  --text:#edf6ff;
  --muted:#91a7bd;
  --blue:#37b7ff;
  --cyan:#68e0ff;
  --green:#43d6a0;
  --red:#ff7184;
  --amber:#ffc66b;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% -20%,#14375a 0,transparent 48%),var(--bg);
  color:var(--text);
}

.topbar {
  min-height:68px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1b3148;
  background:#07111fcc;
  position:sticky;
  top:0;
  z-index:2;
  backdrop-filter:blur(14px);
}

.brand {
  display:flex;
  gap:10px;
  align-items:center;
  font-size:14px;
  letter-spacing:.06em;
}

.brandicon {
  width:40px;
  height:40px;
  border:1px solid #2c9bd8;
  border-radius:13px;
  display:grid;
  place-items:center;
  color:var(--cyan);
  font-size:25px;
}

.brand small {
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.16em;
  margin-top:3px;
}

.secure {
  font-size:9px;
  color:#a9c0d5;
  letter-spacing:.08em;
}

.secure i {
  display:inline-block;
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  margin-right:5px;
}

.shell {
  max-width:980px;
  margin:auto;
  padding:28px 15px 55px;
  min-height:calc(100vh - 120px);
}

footer {
  text-align:center;
  padding:20px;
  color:#668098;
  font-size:10px;
  border-top:1px solid #172a3e;
}

.hero {
  text-align:center;
  margin:18px auto 28px;
  max-width:650px;
}

.eyebrow {
  font-size:10px;
  letter-spacing:.2em;
  color:var(--cyan);
  font-weight:700;
}

.hero h1 {
  font-size:clamp(28px,7vw,46px);
  margin:12px 0 8px;
}

.hero p,.muted {
  color:var(--muted);
  line-height:1.75;
  font-size:13px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.card {
  background:linear-gradient(145deg,#10243aee,#0a1726f2);
  border:1px solid var(--line);
  border-radius:19px;
  padding:20px;
  box-shadow:0 18px 45px #0003;
}

.access-card {
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.iconbox {
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:#143756;
  color:var(--cyan);
  font-size:23px;
}

.card h2 {
  font-size:18px;
  margin:14px 0 5px;
}

.btn {
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:linear-gradient(110deg,#168bd0,#35c1ed);
  color:#041321;
  font-weight:800;
  font-size:12px;
  cursor:pointer;
  min-height:46px;
}

.btn.secondary {
  background:#142a40;
  color:#d8ebfa;
  border:1px solid #294760;
}

.btn.danger {
  background:#542332;
  color:#ffdce2;
  border:1px solid #814050;
}

.btn.full { width:100%; }

.btn.small {
  min-height:35px;
  padding:7px 10px;
  font-size:10px;
}

.field {
  display:block;
  margin:16px 0;
}

.field span {
  display:block;
  font-size:11px;
  color:#b5c9da;
  margin-bottom:7px;
}

.field input,.field select {
  width:100%;
  border:1px solid #29445d;
  background:#071625;
  color:var(--text);
  padding:13px;
  border-radius:11px;
  font:inherit;
  outline:none;
}

.field input:focus,.field select:focus {
  border-color:var(--blue);
}

.formcard {
  max-width:480px;
  margin:24px auto;
}

.notice {
  padding:12px 14px;
  border:1px solid #29445d;
  border-radius:12px;
  color:#adc5d9;
  background:#0a1a2b;
  font-size:12px;
  line-height:1.7;
  margin:13px 0;
  overflow-wrap:anywhere;
}

.notice.error {
  color:#ff9aa8;
  border-color:#733747;
  background:#291722;
}

.notice.success {
  color:#82e8bf;
  border-color:#28684f;
  background:#102a25;
}

.back {
  color:var(--cyan);
  background:none;
  border:0;
  padding:0;
  cursor:pointer;
  font:inherit;
  font-size:12px;
}

.row {
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
}

.between { justify-content:space-between; }

.dashboard-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.dashboard-head h1 {
  font-size:24px;
  margin:4px 0;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:15px 0;
}

.stat {
  padding:14px;
  border-radius:14px;
  background:#0d1d2e;
  border:1px solid var(--line);
}

.stat strong {
  font-size:22px;
  display:block;
}

.stat span {
  color:var(--muted);
  font-size:10px;
}

.tablewrap {
  overflow:auto;
  border:1px solid var(--line);
  border-radius:13px;
  margin-top:12px;
}

table {
  border-collapse:collapse;
  width:100%;
  min-width:600px;
  font-size:11px;
}

th,td {
  text-align:left;
  padding:11px;
  border-bottom:1px solid #1a3045;
}

th {
  color:#92adc5;
  font-size:10px;
  background:#0a1827;
}

td { color:#d8e7f4; }

.pill {
  font-size:9px;
  border-radius:99px;
  padding:5px 8px;
  background:#163b32;
  color:#79e4b7;
}

.pill.off {
  background:#41232d;
  color:#ff9aa8;
}

.pill.warn {
  background:#49391f;
  color:#ffc66b;
}

.scanner-hero {
  background:linear-gradient(120deg,#102d49,#0c1b2c);
  border:1px solid #245071;
  border-radius:20px;
  padding:22px;
  text-align:center;
  margin-bottom:17px;
}

.scan-button {
  width:min(220px,75vw);
  height:58px;
  margin:12px auto;
}

.checks {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.check {
  background:#0d1b2b;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  text-align:left;
  color:var(--text);
  min-height:84px;
  cursor:pointer;
}

.check strong {
  display:block;
  font-size:12px;
  margin-bottom:7px;
}

.check span {
  font-size:10px;
  color:var(--amber);
}

.filebox {
  border:1px dashed #35607e;
  background:#0c1d2e;
  border-radius:16px;
  padding:18px;
  margin:16px 0;
}

.filemeta {
  font-size:11px;
  color:#b0c5d7;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.hidden { display:none!important; }

.detail { margin-top:12px; }

.modal {
  position:fixed;
  inset:0;
  background:#020812d9;
  display:grid;
  place-items:center;
  padding:18px;
  z-index:5;
}

.modal .card {
  max-width:500px;
  width:100%;
  max-height:85vh;
  overflow:auto;
}

code {
  overflow-wrap:anywhere;
  color:#8de5ff;
}

@media(max-width:600px) {
  .grid,.checks { grid-template-columns:1fr; }
  .shell { padding-top:22px; }
  .card { padding:17px; }
  .access-card { min-height:170px; }
  .stats { gap:6px; }
  .stat { padding:10px; }
  .stat strong { font-size:18px; }
  .dashboard-head { align-items:flex-start; }
  .secure { font-size:8px; }
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand">
    <div class="brandicon">⬡</div>
    <div>
      FF <b>SCAN CENTER</b>
      <small>ระบบตรวจสอบความปลอดภัย Android</small>
    </div>
  </div>
  <span class="secure"><i></i> ระบบตรวจสอบเบื้องต้น</span>
</header>

<main id="app" class="shell">
  <div class="notice">กำลังโหลด FF SCAN CENTER...</div>
</main>

<footer>
  FF SCAN CENTER • เป็นการตรวจสอบเบื้องต้น ไม่ได้รับรองความปลอดภัย 100%
</footer>

<script src="/app.js"></script>
</body>
</html>
